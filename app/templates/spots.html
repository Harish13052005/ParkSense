{% extends "base.html" %}
{% block title %}Parking Bays | ParkSense{% endblock %}

{% block content %}
<header class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
    <div>
        <h1 class="h2 mb-1">Parking bays</h1>
        <p class="text-secondary mb-0">Manage bay status, compatible vehicle type, and entry distance.</p>
    </div>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addSpotModal">Add bay</button>
</header>
<div id="spot-error" class="alert alert-danger d-none" role="alert"></div>
<div class="card">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0" id="spots-table">
            <thead class="table-light"><tr><th>Bay</th><th>Vehicle type</th><th>Entry distance</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
</div>
{% include "_spot_modals.html" %}
<script src="{{ url_for('static', filename='js/spots.js') }}" defer></script>
{% endblock %}
